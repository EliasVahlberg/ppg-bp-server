<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPG-BP status</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d1210">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<header>
  <h1>Collection status</h1>
  <div class="meta">
    <span id="scope" class="scope"></span>
    <span id="updated" aria-live="polite"></span>
    <button id="refresh" type="button">Refresh</button>
    <button id="signout" type="button" hidden>Sign out</button>
  </div>
</header>

<!-- Sign-in is a panel rather than a separate page so a expired cookie does not
     lose the user's place, and so the offline shell has nothing to route. -->
<section id="login" hidden>
  <h2>Sign in</h2>
  <p>Paste your access token.</p>
  <form id="login-form">
    <label for="token">Access token</label>
    <input id="token" name="token" type="password" autocomplete="current-password"
           spellcheck="false" required>
    <button type="submit">Sign in</button>
  </form>
  <p id="login-error" class="error" role="alert"></p>
</section>

<main id="main" hidden>
  <section id="warnings" aria-label="Warnings"></section>
  <section id="subjects" aria-label="Subjects"></section>

  <div class="range-row">
    <label for="range">Window</label>
    <select id="range">
      <option value="14">14 days</option>
      <option value="30">30 days</option>
      <option value="60" selected>60 days</option>
      <option value="180">6 months</option>
      <option value="730">Everything</option>
    </select>
  </div>

  <section id="charts" aria-label="Charts"></section>

  <details id="details">
    <summary>Details</summary>
    <div id="tables"></div>
    <div id="waveform-detail"></div>
  </details>

  <section id="totals" aria-label="Store totals"></section>
</main>

<footer>
  <p>Not medical advice. Blood pressure values come from the cuff, never from PPG.</p>
</footer>

<script src="/app/charts.js"></script>
<script src="/app/app.js"></script>
</body>
</html>
