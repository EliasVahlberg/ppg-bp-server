[project]
name = "ppg-pi-server"
version = "0.1.0"
description = "Ingest server + dashboard for PPG-BP monitoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "duckdb>=1.5.2",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.7",
]
dashboard = [
    "dash>=2.18",
    "plotly>=5.24",
]

[project.scripts]
ppg-pi-server = "ppg_pi_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppg_pi_server"]
# The status UI ships as package data, not as a separate deployment step.
artifacts = ["src/ppg_pi_server/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored upstream code is excluded: keeping it byte-identical to its source is
# worth more than lint cleanliness, since any local edit must be re-applied on
# every re-vendor.
extend-exclude = ["src/ppg_pi_server/_vendor"]
